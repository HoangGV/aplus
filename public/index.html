<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4169E1" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link
      rel="icon"
      type="image/webp"
      href="%PUBLIC_URL%/icon-ndh-aplus.webp"
    />
    <link
      rel="apple-touch-icon"
      href="%PUBLIC_URL%/icon-ndh-aplus.webp"
    />
    <title>Aplus | Người đồng hành - Điểm số chỉ có thể tốt hơn</title>
    <meta
      name="description"
      content="Điểm số chỉ có thể tốt hơn"
    />
    <meta name="author" content="Aplus | Người đồng hành" />
    <meta
      name="keywords"
      content="aplus, người đồng hành, tính gpa, tính cpa, cải thiện điểm, bảng điểm sinh viên, học tập"
    />
    <meta property="og:title" content="Aplus | Người đồng hành" />
    <meta property="og:description" content="Điểm số chỉ có thể tốt hơn" />
    <meta property="og:image" content="%PUBLIC_URL%/ndh-aplus.webp" />
    <meta property="og:url" content="https://aplus.ndh.io.vn" />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("aplus-theme");
          if (saved === "dark") {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased selection:bg-[#4169E1]/20 selection:text-[#4169E1]">
    <noscript>Vui lòng bật JavaScript để sử dụng Aplus.</noscript>
    <div id="root"></div>
  </body>
</html>
